[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "myjobs"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx[socks]>=0.27.0",
    "playwright>=1.44.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.2",
    "typer>=0.12.3",
    "rich>=13.7.1",
    "jinja2>=3.1.4",
    "python-dotenv>=1.0.1",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "structlog>=24.4",
    "selectolax>=0.4.7",
    "fast-langdetect>=0.3",
    "pypdf>=6.10.2",
    "jmespath>=1.0",
    "defusedxml>=0.7.1",
    "pyyaml>=6.0",
    "nh3>=0.2.17",
    # jobseek pipeline stack
    "asyncpg>=0.29",
    "redis[asyncio]>=5.0",
    "pydantic-settings>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "prometheus-client>=0.20",
    "polars>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "fakeredis[lua]>=2.26"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src" = ["lua/*.lua"]

[project.scripts]
myjobs = "src.cli:myjobs_main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
