# gitleaks config: default rules + allowlist for known public values.
[extend]
useDefault = true

[allowlist]
description = "Public client-side ATS/search keys that companies embed in their own career pages (inherited from jobseek board data), and doc examples."
paths = [
  '''data/boards\.csv''',
  # Welcome to the Jungle's public search-only Algolia key, embedded in its site and in jobseek's repo.
  '''src/core/monitors/welcometothejungle\.py''',
]
