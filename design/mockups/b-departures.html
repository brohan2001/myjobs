<style>
:root{--bg:#0C0B08;--panel:#16130D;--tx:#F1E7CC;--dim:#A99C77;--amb:#FFB000;--edge:#8E7F55;--line:#2E291C;--actbg:#FFB000;--acttx:#0C0B08;--rowsel:#241E10;}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#F6F2E4;--panel:#EBE5D0;--tx:#16140E;--dim:#5A523C;--amb:#7A4600;--edge:#7A704F;--line:#C9BF9F;--actbg:#16140E;--acttx:#FFC52E;--rowsel:#E4DDC3;}}
:root[data-theme=light]{--bg:#F6F2E4;--panel:#EBE5D0;--tx:#16140E;--dim:#5A523C;--amb:#7A4600;--edge:#7A704F;--line:#C9BF9F;--actbg:#16140E;--acttx:#FFC52E;--rowsel:#E4DDC3;}
:root[data-theme=dark]{--bg:#0C0B08;--panel:#16130D;--tx:#F1E7CC;--dim:#A99C77;--amb:#FFB000;--edge:#8E7F55;--line:#2E291C;--actbg:#FFB000;--acttx:#0C0B08;--rowsel:#241E10;}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
ol,ul{list-style:none;margin:0;padding:0}
button,select,input{font:inherit;color:inherit}
a{color:inherit}
[hidden]{display:none!important}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);max-width:calc(100vw - 32px);padding:10px 14px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:9}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

body{background:var(--bg);color:var(--tx);font:400 14px/1.4 'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.skip{position:absolute;left:-999px;top:0;background:var(--actbg);color:var(--acttx);padding:8px 12px}
.skip:focus{left:8px;top:8px;z-index:10}
.bar{background:var(--panel);border-bottom:2px solid var(--amb)}
.bar-in{max-width:1400px;margin:0 auto;padding:12px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px}
h1{margin:0;font-size:18px;letter-spacing:.14em;color:var(--amb);font-weight:700;display:flex;align-items:center;gap:10px}
.dot{width:9px;height:9px;background:var(--amb);display:inline-block;animation:blink 1.6s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
.fresh{margin:0;font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;flex:1 1 100%;order:3}
.tbtn{margin-left:auto;background:none;border:1px solid var(--edge);padding:0 12px;min-height:36px;cursor:pointer;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.tbtn::after{content:'Signage'}
.tbtn[data-now=light]::after{content:'Night'}
.cmd{max-width:1400px;margin:0 auto;padding:14px 16px 6px}
.codes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.chip{appearance:none;background:none;border:1px solid var(--edge);color:var(--tx);min-height:40px;padding:0 10px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.chip:hover{border-color:var(--amb)}
.chip[aria-pressed=true]{background:var(--actbg);color:var(--acttx);border-color:var(--actbg);font-weight:700}
.chip.code{font-size:16px;font-weight:700;letter-spacing:.08em}
.chip.code.far{border-style:dashed}
.ctrls{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:12px;align-items:center}
.grp{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.lbl{font-size:11px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;margin-right:6px}
.grp .chip{min-height:34px;padding:0 9px;font-size:12px}
.find{display:flex;align-items:center;gap:8px;flex:1 1 100%;border-bottom:2px solid var(--amb);padding-bottom:2px}
.find span{color:var(--amb);font-weight:700}
.find input{flex:1;min-width:0;background:none;border:0;min-height:38px;font-size:15px;text-transform:uppercase;letter-spacing:.04em;border-radius:0}
.find input::placeholder{color:var(--dim);opacity:1}
.find kbd{font:700 11px 'JetBrains Mono',monospace;color:var(--dim);border:1px solid var(--edge);padding:1px 6px}
main{max-width:1400px;margin:0 auto;padding:0 16px 60px}
.count{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin:14px 0 8px}
.cols{display:none}
.row{display:grid;grid-template-columns:46px 44px minmax(0,1fr);column-gap:10px;padding:10px 8px;border-bottom:1px solid var(--line);cursor:pointer;outline:none;border-left:3px solid transparent}
.row:hover{background:var(--rowsel)}
.row:focus{background:var(--rowsel);border-left-color:var(--amb)}
.c-t{grid-area:1/1;color:var(--amb);font-weight:700;text-align:right}
.c-code{grid-area:1/2;font-weight:700;letter-spacing:.06em}
.c-title{grid-area:1/3;text-decoration:none;font-weight:500;font-size:15px;line-height:1.3}
.c-title:hover{text-decoration:underline}
.c-co{grid-area:2/3;color:var(--dim)}
.meta{grid-area:3/3;display:flex;flex-wrap:wrap;gap:0 12px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim)}
.c-pay{color:var(--tx);font-weight:700}
.c-pay:empty{display:none}
.group{display:flex;justify-content:space-between;background:var(--actbg);color:var(--acttx);padding:5px 10px;margin-top:14px;font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.div{padding:7px 8px;margin:6px 0;border-top:2px dashed var(--amb);border-bottom:2px dashed var(--amb);color:var(--amb);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.state{padding:32px 4px;max-width:44em}
.state-h{font-size:20px;font-weight:700;color:var(--amb);margin:0 0 8px;line-height:1.3}
.state-p{margin:0 0 16px;color:var(--dim)}
.btn{background:none;border:1px solid var(--amb);color:var(--amb);min-height:44px;padding:0 16px;cursor:pointer;margin:0 8px 8px 0;text-transform:uppercase;letter-spacing:.06em;font-size:13px}
.btn:hover{background:var(--actbg);color:var(--acttx)}
.btn-quiet{border-color:var(--edge);color:var(--tx)}
.load-line{margin:0;padding:12px 8px;color:var(--amb);text-transform:uppercase;letter-spacing:.08em;font-size:12px}
.sk{display:grid;grid-template-columns:46px 44px 1fr;column-gap:10px;padding:10px 8px;border-bottom:1px solid var(--line);height:76px;border-left:3px solid transparent}
.sk i{display:block;height:14px;background:var(--line);animation:p 1s steps(2) infinite alternate}
.sk i:nth-child(2){width:80%}
@keyframes p{from{opacity:.4}to{opacity:1}}
.demo{margin-top:36px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.demo a{margin:0 6px}
.demo a[aria-current=true]{color:var(--amb);font-weight:700}
.demo p{margin:8px 0 0;text-transform:none;letter-spacing:0}
.toast{background:var(--actbg);color:var(--acttx);font-size:13px;font-weight:700}
:focus-visible{outline:2px solid var(--amb);outline-offset:2px}
.row:focus-visible{outline:none}
@media (min-width:600px){.codes{grid-template-columns:repeat(8,minmax(0,1fr))}}
@media (min-width:900px){
  .bar-in{padding:14px 32px}
  .fresh{flex:0 1 auto;order:0}
  .cmd,main{padding-left:32px;padding-right:32px}
  .find{flex:1 1 280px;max-width:420px;margin-left:auto}
  .cols,.row,.sk{grid-template-columns:56px 52px minmax(0,2.3fr) minmax(0,1.2fr) 88px 130px 120px;column-gap:14px}
  .cols{display:grid;padding:6px 8px 6px 11px;font-size:11px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid var(--edge)}
  .cols span:first-child{text-align:right}
  .row{align-items:baseline;padding:8px 8px}
  .c-t,.c-code,.c-title,.c-co{grid-area:auto}
  .meta{display:contents}
  .c-mode,.c-pay,.c-src{font-size:12px}
  .c-pay{text-align:right}
  .c-pay:empty{display:block}
  .c-pay:empty::after{content:'-';color:var(--line)}
  .c-src{text-align:right}
  .sk i:nth-child(2){grid-column:3}
}

</style>
</head>

<script>
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
window.DESIGN={
 group:function(r){return r.age<60?'Last hour':r.age<360?'Past 6 hours':r.age<1440?'Past 24 hours':r.age<4320?'Past 3 days':'Past 7 days';},
 groupHeader:function(g,n){return '<li class="group"><span>'+g+'</span><span>'+n+'</span></li>';},
 row:function(r,i){
  return '<li class="row" data-i="'+i+'" tabindex="-1">'+
   '<span class="c-t"><span aria-hidden="true">'+r.ago+'</span><span class="sr">'+r.agoLong+'</span></span>'+
   '<span class="c-code">'+r.code+'</span>'+
   '<a class="c-title" href="#">'+esc(r.title)+'</a><span class="c-co">'+esc(r.company)+'</span>'+
   '<span class="meta"><span class="c-mode">'+(r.mode||'').replace('On-site','Onsite')+'</span><span class="c-pay">'+r.sal+'</span><span class="c-src">'+esc(r.ats)+'</span></span></li>';
 },
 divider:function(n){return '<li class="div" role="separator">'+n+' above: new since your last visit \u00B7 Fri 9 Oct 18:20</li>';},
 skeleton:function(){return '<li class="sk" aria-hidden="true"><i></i><i></i></li>';}
};
</script>

LIST.addEventListener('focusin', function (e) {
  var row = e.target.closest && e.target.closest('.row');
  if (row) cursor = $$('.row', LIST).indexOf(row);
});

function applyTheme(t, store) {
  document.documentElement.setAttribute('data-theme', t);
  if (store) { try { localStorage.setItem('theme', t); } catch (x) {} }
  $$('[data-act=theme]').forEach(function (b) { b.setAttribute('aria-label', 'Switch to ' + (t === 'dark' ? 'light' : 'dark') + ' theme'); b.setAttribute('data-now', t); });
}
try { var st = localStorage.getItem('theme'); if (st) document.documentElement.setAttribute('data-theme', st); } catch (x) {}
applyTheme(document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'), false);
window.addEventListener('pagehide', function () { try { localStorage.setItem('lastVisit', new Date().toISOString()); } catch (x) {} });
update();
})();

</script>
</body>
</html>
